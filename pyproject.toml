[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stayzy-api"
version = "0.1.0"
description = "Provider-neutral authentication, entitlement, and companion voice-pack API for Stayzy."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.21,<1",
  "app-store-server-library[async]>=3.1.2,<4",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.100,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
